name: Generate Android Keystore

# One-time helper: creates a release signing keystore inside GitHub Actions
# (no local JDK needed) and uploads it as a private, short-lived artifact.
# Download the artifact, then paste the values into
# Settings → Secrets and variables → Actions.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Key alias"
        required: true
        default: "cryptopop"
      dname:
        description: "Certificate distinguished name"
        required: true
        default: "CN=CryptoPOP, OU=Wallet, O=CryptoPOP, L=McKinney, ST=Texas, C=US"
      validity_days:
        description: "Validity in days"
        required: true
        default: "10000"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate keystore + passwords
        env:
          KEY_ALIAS: ${{ inputs.key_alias }}
          DNAME: ${{ inputs.dname }}
          VALIDITY: ${{ inputs.validity_days }}
        run: |
          set -euo pipefail
          mkdir -p out
          STORE_PASS="$(openssl rand -base64 24 | tr -d '\n/+=' | cut -c1-24)"
          KEY_PASS="$STORE_PASS"

          keytool -genkeypair -v \
            -keystore out/release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity "$VALIDITY" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "$DNAME"

          base64 -w0 out/release.keystore > out/ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "$STORE_PASS" > out/ANDROID_KEYSTORE_PASSWORD.txt
          printf '%s' "$KEY_PASS"   > out/ANDROID_KEY_PASSWORD.txt
          printf '%s' "$KEY_ALIAS"  > out/ANDROID_KEY_ALIAS.txt

          {
            echo "### Keystore generated"
            echo ""
            echo "Download the **android-keystore** artifact and add these four repo secrets:"
            echo ""
            echo "| Secret | File in artifact |"
            echo "| --- | --- |"
            echo "| ANDROID_KEYSTORE_BASE64 | ANDROID_KEYSTORE_BASE64.txt |"
            echo "| ANDROID_KEYSTORE_PASSWORD | ANDROID_KEYSTORE_PASSWORD.txt |"
            echo "| ANDROID_KEY_ALIAS | ANDROID_KEY_ALIAS.txt |"
            echo "| ANDROID_KEY_PASSWORD | ANDROID_KEY_PASSWORD.txt |"
            echo ""
            echo "Keep \`release.keystore\` backed up somewhere safe — losing it means you can never update the Play listing."
            echo "Delete this artifact once the secrets are saved."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload keystore bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: out/
          retention-days: 1
