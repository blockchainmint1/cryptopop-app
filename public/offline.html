<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0a14" />
<title>No connection · POP Wallet</title>
<style>
  html,body{margin:0;height:100%;background:#0d0a14;color:#F5F5F5;font-family:Poppins,system-ui,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;box-sizing:border-box;gap:16px}
  img{width:88px;height:88px}
  h1{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.04em;font-size:40px;margin:0;color:#CCF695}
  p{margin:0;max-width:320px;line-height:1.5;opacity:.85}
  button{margin-top:8px;border:0;border-radius:999px;padding:14px 28px;font-weight:600;font-size:16px;color:#0d0a14;background:linear-gradient(90deg,#FF3DBE,#00E5FF)}
  small{opacity:.55;font-size:12px}
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="POP Wallet" />
  <h1>No connection</h1>
  <p>POP Wallet needs the internet to check balances and send. Your coins are safe — they live on your phone, not here.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <small>We'll reconnect automatically when you're back online.</small>
</main>
<script>addEventListener("online",function(){location.reload()})</script>
</body>
</html>
